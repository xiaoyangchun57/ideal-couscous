name: Deploy 验收环境（CI 门禁 + 飞牛自动部署）

# 对应《验收环境搭建.md》3.2「添加工作流文件」的落地版。
#
# 为什么不能照抄原文的工作流（四点结论不变）：
#   1) 本仓库没有 staging 分支；验收分支与默认分支统一为 acceptance。
#      原文 `git push origin main` 推上去也不会触发任何验收流程。
#   2) 本仓库没有注册任何 self-hosted runner（yanhuo / feiniu 标签都不存在），
#      runs-on: [self-hosted, ...] 的 job 会永久排队。
#   3) 仓库根目录没有 docker-compose.yml；验收 compose 在 平台开发/docker-compose.acceptance.yml，
#      且依赖飞牛本地 .env 里的 INITIAL_ADMIN_PASSWORD，原文 `PORT=8081 docker compose up` 无效。
#   4) 仓库是 PUBLIC，把 self-hosted runner + docker.sock 暴露出来是 GitHub 官方明确警告的高风险组合。
#
# 2026-11-05 之后的变化：
#   a) acceptance 已成为仓库默认分支，Actions 页面的「Run workflow」按钮可见。
#   b) 增加 pull_request 触发，本 job 才能作为 acceptance 的必需状态检查（PR 合并门禁）。
#      分支保护需仓库管理员在 Settings -> Branches 里勾选「验收版构建 + 启动门禁」。
#   c) R33 合并后 APP_RUNTIME_PROFILE=production 启动会强制校验：
#        私有证据目录可读可写 + station_ingest_cutover 已完成（要求 001~014 迁移过的历史业务库）。
#      验收/CI 用全新空库，无法满足第二项；炎火云生产靠 one-shot cutover 服务 + 历史库满足。
#      因此验收与 CI 统一改用 local profile，门禁验证「compose 可解析 / 镜像可构建 / 应用可启动 / health 200」；
#      生产启动契约仍在炎火云用真实库验证。若以后给验收环境换上已迁移的基线库，可改回 production。
#   d) 启动条件以 平台开发/docker-compose.acceptance.yml 为唯一事实来源。
#      CI 从它生成一份临时副本，只替换挂载源路径和镜像 tag，再用 docker compose 启动。
#      环境变量、command（umask/mkdir/补表/app.py）、healthcheck、restart 策略全部同源。
#      旧版 CI 曾用 sitecustomize 把 SQLite 锁等待从源码的 3 秒强行放宽到 30 秒，
#      飞牛与生产并未放宽 —— 这会让门禁给出与真实环境不符的绿灯，已移除。
#      锁等待现在三边一致，均为 app.py 源码默认值（get_db: timeout=3 / PRAGMA busy_timeout=3000）。
#
# 分工：本工作流只做质量门禁；飞牛 water-accept-poller 每 60 秒轮询 acceptance 并重建验收容器。
# GitHub 托管 runner 访问不到局域网飞牛，因此不做内网部署。
# 若以后改用 staging 分支，需同步把飞牛 deploy-feiniu-poller.sh 里的 BRANCH 改成 staging。

on:
  push:
    branches: [acceptance]
  pull_request:
    branches: [acceptance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: 验收版构建 + 启动门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成仅用于本次 CI 的初始管理员密码
        run: |
          # 空库 seed_users() 要求 >=12 位；这是临时随机值，
          # 不写入仓库，也不是飞牛验收环境的真实密码。
          P="$(openssl rand -hex 16)"
          echo "::add-mask::$P"
          echo "INITIAL_ADMIN_PASSWORD=$P" >> "$GITHUB_ENV"

      - name: 校验验收 compose 配置
        run: |
          docker compose -f 平台开发/docker-compose.acceptance.yml -p water-accept-ci config -q
          echo "compose 配置校验通过（含必需变量 INITIAL_ADMIN_PASSWORD）"

      - name: 生成 CI 专用 Dockerfile（仅替换下载源）
        run: |
          # 飞牛在国内，Dockerfile.acceptance 用 DaoCloud / 淘宝 / 清华源；
          # GitHub 托管 runner 在海外，用官方源更快更稳。
          # 只替换下载来源，基础镜像版本、构建步骤、产物与飞牛验收镜像完全一致。
          # 生成到 /tmp，不写回仓库，不影响飞牛构建。
          sed -e 's|docker.m.daocloud.io/library/||g' \
              -e 's|npm config set registry https://registry.npmmirror.com && ||' \
              -e 's|mirrors.tuna.tsinghua.edu.cn|deb.debian.org|g' \
              -e 's|--index-url https://pypi.tuna.tsinghua.edu.cn/simple ||' \
              平台开发/Dockerfile.acceptance > /tmp/Dockerfile.acceptance.ci
          echo "--- CI Dockerfile 关键行 ---"
          (grep -E '^(FROM|RUN (npm|pip|apt))' /tmp/Dockerfile.acceptance.ci | head -20) || true

      - name: 生成 CI 专用 compose（只换挂载路径与镜像 tag）
        run: |
          # 启动条件必须和飞牛完全一致，因此不手写 docker run，
          # 而是从飞牛那一份 compose 派生，只改两处 CI 环境无法复用的值：
          #   1) /vol1/@team/水质设备运维/ 是飞牛本地绝对路径 -> CI 临时目录
          #   2) 镜像 tag 换成上一步构建的 water-monitor-app:ci
          # 环境变量、command、healthcheck、restart 策略一律原样保留。
          mkdir -p /tmp/water-accept-ci/data /tmp/water-accept-ci/uploads /tmp/water-accept-ci/private_uploads
          sed -e 's|/vol1/@team/水质设备运维/|/tmp/water-accept-ci/|g' \
              -e 's|image: water-monitor-app:acceptance|image: water-monitor-app:ci|' \
              平台开发/docker-compose.acceptance.yml > /tmp/docker-compose.acceptance.ci.yml
          python3 - <<'PY'
          import pathlib
          fn = pathlib.Path('平台开发/docker-compose.acceptance.yml').read_text(encoding='utf-8')
          ci = pathlib.Path('/tmp/docker-compose.acceptance.ci.yml').read_text(encoding='utf-8')
          expected = fn.replace('/vol1/@team/水质设备运维/', '/tmp/water-accept-ci/') \
                       .replace('image: water-monitor-app:acceptance', 'image: water-monitor-app:ci')
          assert ci == expected, 'CI compose 与飞牛 compose 出现预期外差异'
          for key in ('APP_RUNTIME_PROFILE', 'LD_PRELOAD', 'PRIVATE_UPLOAD_DIR',
                      'healthcheck:', 'restart:', 'umask 0007', 'init_acceptance_schema.py'):
              assert key in ci, '启动条件缺失: ' + key
          assert 'PYTHONPATH' not in ci, 'CI 不得注入 PYTHONPATH 补丁'
          assert 'sitecustomize' not in ci, 'CI 不得注入 sitecustomize 补丁'
          print('启动条件一致性断言通过：env / command / healthcheck / restart 与飞牛同源')
          print('SQLite 锁等待：CI = 飞牛 = 生产 = app.py 源码默认值，无运行时补丁')
          PY

      - name: 构建验收镜像
        run: |
          docker build -f /tmp/Dockerfile.acceptance.ci -t water-monitor-app:ci 平台开发

      - name: 空库启动 + /api/health 烟测
        run: |
          set -euo pipefail
          ci_compose() {
            docker compose --project-directory 平台开发 \
              -f /tmp/docker-compose.acceptance.ci.yml -p water-accept-ci "$@"
          }
          docker rm -f water-monitor-accept >/dev/null 2>&1 || true
          # --no-build：镜像已由上一步构建好；build.context 由 --project-directory 解析为 平台开发。
          # compose 里的 restart: unless-stopped 会在全新空库首次 seed 撞锁退出后自动重启，
          # 复用上一次已初始化的库收敛 —— 与飞牛验收容器的真实表现一致，不再手写 docker start。
          ci_compose up -d --no-build
          OK=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json 2>/dev/null; then
              OK=1
              break
            fi
            sleep 2
          done
          if [ "$OK" != "1" ]; then
            echo "健康检查未通过，容器日志："
            docker logs --tail 150 water-monitor-accept || true
            exit 1
          fi
          echo "健康检查通过：$(cat /tmp/health.json)"

      - name: 收集日志 / 清理
        if: always()
        run: |
          docker logs --tail 60 water-monitor-accept 2>&1 || true
          docker compose --project-directory 平台开发 \
            -f /tmp/docker-compose.acceptance.ci.yml -p water-accept-ci down --remove-orphans || true
          docker rm -f water-monitor-accept >/dev/null 2>&1 || true

      - name: 部署交接说明
        run: |
          {
            echo "## 验收环境 CI 通过"
            echo ""
            echo "- 提交：\`$GITHUB_SHA\`"
            echo "- 分支：\`$GITHUB_REF_NAME\`"
            echo "- 事件：\`$GITHUB_EVENT_NAME\`"
            echo "- ✅ 验收 compose 可解析、镜像可构建、与飞牛同一套启动条件下全新空库可启动、\`/api/health\` 返回 200"
            echo "- ✅ 启动条件单一事实来源：\`平台开发/docker-compose.acceptance.yml\`；SQLite 锁等待与飞牛/生产一致"
            echo ""
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "### 部署由飞牛轮询器执行"
              echo "本次 push 会被飞牛上的 \`water-accept-poller\` 在 ≤60 秒内发现，自动重建 \`water-monitor-accept\`。"
            else
              echo "### 本次不改变验收环境"
              echo "当前事件是 \`$GITHUB_EVENT_NAME\`，\`acceptance\` 的 HEAD 没有前进，飞牛轮询器不会重建容器；PR 合并后的 push 才会触发部署。"
            fi
            echo ""
            echo "验收地址：<http://192.168.2.250:8080>；健康接口：<http://192.168.2.250:8080/api/health>"
            echo ""
            echo "> GitHub 托管 runner 无法访问局域网飞牛，因此本工作流只做质量门禁，不做内网部署。"
            echo "> 若改用 \`staging\` 分支，需同步修改飞牛 \`deploy-feiniu-poller.sh\` 的 \`BRANCH\`。"
          } >> "$GITHUB_STEP_SUMMARY"
