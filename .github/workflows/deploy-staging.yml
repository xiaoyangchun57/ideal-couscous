name: Deploy 验收环境（CI 门禁 + 飞牛自动部署）

# 对应《验收环境搭建.md》3.2「添加工作流文件」的落地版。
#
# 为什么不能照抄原文的工作流（四点结论不变）：
#   1) 本仓库没有 staging 分支；验收分支与默认分支统一为 acceptance。
#      原文 `git push origin main` 推上去也不会触发任何验收流程。
#   2) 本仓库没有注册任何 self-hosted runner（yanhuo / feiniu 标签都不存在），
#      runs-on: [self-hosted, ...] 的 job 会永久排队。
#   3) 仓库根目录没有 docker-compose.yml；验收 compose 在 平台开发/docker-compose.acceptance.yml，
#      且依赖飞牛本地 .env 里的 INITIAL_ADMIN_PASSWORD，原文 `PORT=8081 docker compose up` 无效。
#   4) 仓库是 PUBLIC，把 self-hosted runner + docker.sock 暴露出来是 GitHub 官方明确警告的高风险组合。
#
# 2026-11-05 之后的三点变化：
#   a) acceptance 已成为仓库默认分支，Actions 页面的「Run workflow」按钮可见。
#   b) 增加 pull_request 触发，本 job 才能作为 acceptance 的必需状态检查（PR 合并门禁）。
#      分支保护需仓库管理员在 Settings -> Branches 里勾选「验收版构建 + 启动门禁」。
#   c) R33 合并后 APP_RUNTIME_PROFILE=production 启动会强制校验：
#        私有证据目录可读可写 + station_ingest_cutover 已完成（要求 001~014 迁移过的历史业务库）。
#      验收/CI 用全新空库，无法满足第二项；炎火云生产靠 one-shot cutover 服务 + 历史库满足。
#      因此验收与 CI 统一改用 local profile，门禁验证「compose 可解析 / 镜像可构建 / 应用可启动 / health 200」；
#      生产启动契约仍在炎火云用真实库验证。若以后给验收环境换上已迁移的基线库，可改回 production。
#
# 分工：本工作流只做质量门禁；飞牛 water-accept-poller 每 60 秒轮询 acceptance 并重建验收容器。
# GitHub 托管 runner 访问不到局域网飞牛，因此不做内网部署。
# 若以后改用 staging 分支，需同步把飞牛 deploy-feiniu-poller.sh 里的 BRANCH 改成 staging。

on:
  push:
    branches: [acceptance]
  pull_request:
    branches: [acceptance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: 验收版构建 + 启动门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成仅用于本次 CI 的初始管理员密码
        run: |
          # 空库 seed_users() 要求 >=12 位；这是临时随机值，
          # 不写入仓库，也不是飞牛验收环境的真实密码。
          P="$(openssl rand -hex 16)"
          echo "::add-mask::$P"
          echo "INITIAL_ADMIN_PASSWORD=$P" >> "$GITHUB_ENV"

      - name: 校验验收 compose 配置
        run: |
          docker compose -f 平台开发/docker-compose.acceptance.yml -p water-accept-ci config -q
          echo "compose 配置校验通过（含必需变量 INITIAL_ADMIN_PASSWORD）"

      - name: 生成 CI 专用 Dockerfile（仅替换下载源）
        run: |
          # 飞牛在国内，Dockerfile.acceptance 用 DaoCloud / 淘宝 / 清华源；
          # GitHub 托管 runner 在海外，用官方源更快更稳。
          # 只替换下载来源，基础镜像版本、构建步骤、产物与飞牛验收镜像完全一致。
          # 生成到 /tmp，不写回仓库，不影响飞牛构建。
          sed -e 's|docker.m.daocloud.io/library/||g' \
              -e 's|npm config set registry https://registry.npmmirror.com && ||' \
              -e 's|mirrors.tuna.tsinghua.edu.cn|deb.debian.org|g' \
              -e 's|--index-url https://pypi.tuna.tsinghua.edu.cn/simple ||' \
              平台开发/Dockerfile.acceptance > /tmp/Dockerfile.acceptance.ci
          echo "--- CI Dockerfile 关键行 ---"
          (grep -E '^(FROM|RUN (npm|pip|apt))' /tmp/Dockerfile.acceptance.ci | head -20) || true

      - name: 生成 CI 专用 SQLite 锁等待补丁
        run: |
          # app.py 的 get_db() 硬编码 `timeout=3` / `PRAGMA busy_timeout=3000`。
          # 全新空库首次 seed（6000+ 条排程）在 GitHub runner 的 overlay2 上会撞
          # `sqlite3.OperationalError: database is locked`；飞牛靠容器重启策略收敛。
          # 这里只在 CI 容器内放宽锁等待；实测全新空库首次 seed 仍可能撞锁，
          # 因此配合下面「重启同一容器、复用已初始化库」的重试一起收敛
          # （与飞牛验收容器 restart: unless-stopped 的实际表现一致）。
          # 不改仓库源码、不改业务逻辑。
          mkdir -p /tmp/ci-patch
          cat > /tmp/ci-patch/sitecustomize.py <<'PY'
          """CI-only: widen SQLite lock tolerance on a brand-new database."""
          import sqlite3

          class _CIConnection(sqlite3.Connection):
              def execute(self, sql, *args, **kwargs):
                  if isinstance(sql, str) and "busy_timeout" in sql.lower():
                      sql = "PRAGMA busy_timeout=30000"
                  return super().execute(sql, *args, **kwargs)

          _orig_connect = sqlite3.connect

          def _connect(*args, **kwargs):
              kwargs["timeout"] = 30
              kwargs.setdefault("factory", _CIConnection)
              return _orig_connect(*args, **kwargs)

          sqlite3.connect = _connect
          PY
          # 显式按路径加载校验：直接 import sitecustomize 会命中 Python 启动时
          # 已缓存的同名模块，得到假阳性。
          python3 -c "import importlib.util, sqlite3; s=importlib.util.spec_from_file_location('ci_patch','/tmp/ci-patch/sitecustomize.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('CI SQLite patch loaded:', sqlite3.connect.__name__)"

      - name: 构建验收镜像
        run: |
          docker build -f /tmp/Dockerfile.acceptance.ci -t water-monitor-app:ci 平台开发

      - name: 空库启动 + /api/health 烟测
        run: |
          set -euo pipefail
          docker rm -f water-accept-ci >/dev/null 2>&1 || true
          # 直接跑镜像，绕开 compose 里飞牛专用的 /vol1 绝对路径挂载；
          # 启动命令与 docker-compose.acceptance.yml 保持一致（先补表再启动）。
          # R33 后 production 启动需要 cutover 就绪的历史业务库，全新空库无法满足；
          # 改用 local profile 验证「构建 + 启动 + /api/health」，与飞牛验收 compose 保持一致。
          docker run -d --name water-accept-ci \
            -p 127.0.0.1:8080:5000 \
            -v /tmp/ci-patch:/ci:ro \
            -e PYTHONPATH=/ci \
            -e TZ=Asia/Shanghai \
            -e APP_RUNTIME_PROFILE=local \
            -e ENABLE_DEMO_SEED=0 \
            -e SKIP_BACKFILL=1 \
            -e BACKEND_HOST=0.0.0.0 \
            -e INITIAL_ADMIN_PASSWORD="$INITIAL_ADMIN_PASSWORD" \
            -w /app/backend \
            water-monitor-app:ci \
            sh -ec 'python init_acceptance_schema.py && exec python app.py'
          # 与飞牛验收容器 restart: unless-stopped 的行为一致：
          # 若全新空库初始化中途崩溃，重启同一容器（保留已初始化的库）再试。
          OK=0
          for ATTEMPT in 1 2 3; do
            if [ "$ATTEMPT" -gt 1 ]; then
              RUNNING="$(docker inspect -f '{{.State.Running}}' water-accept-ci 2>/dev/null || echo false)"
              if [ "$RUNNING" != "true" ]; then
                echo "第 $ATTEMPT 次启动（沿用上一次已初始化的库）"
                docker start water-accept-ci >/dev/null || true
              fi
            fi
            for i in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json 2>/dev/null; then
                OK=1
                break 2
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' water-accept-ci 2>/dev/null || echo false)" != "true" ]; then
                echo "容器已退出，结束本轮等待"
                break
              fi
              sleep 2
            done
          done
          if [ "$OK" != "1" ]; then
            echo "健康检查未通过，容器日志："
            docker logs --tail 120 water-accept-ci || true
            exit 1
          fi
          echo "健康检查通过：$(cat /tmp/health.json)"

      - name: 收集日志 / 清理
        if: always()
        run: |
          docker logs --tail 40 water-accept-ci 2>&1 || true
          docker rm -f water-accept-ci >/dev/null 2>&1 || true

      - name: 部署交接说明
        run: |
          {
            echo "## 验收环境 CI 通过"
            echo ""
            echo "- 提交：\`$GITHUB_SHA\`"
            echo "- 分支：\`$GITHUB_REF_NAME\`"
            echo "- 事件：\`$GITHUB_EVENT_NAME\`"
            echo "- ✅ 验收 compose 可解析、镜像可构建、全新空库可启动、\`/api/health\` 返回 200"
            echo ""
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "### 部署由飞牛轮询器执行"
              echo "本次 push 会被飞牛上的 \`water-accept-poller\` 在 ≤60 秒内发现，自动重建 \`water-monitor-accept\`。"
            else
              echo "### 本次不改变验收环境"
              echo "当前事件是 \`$GITHUB_EVENT_NAME\`，\`acceptance\` 的 HEAD 没有前进，飞牛轮询器不会重建容器；PR 合并后的 push 才会触发部署。"
            fi
            echo ""
            echo "验收地址：<http://192.168.2.250:8080>；健康接口：<http://192.168.2.250:8080/api/health>"
            echo ""
            echo "> GitHub 托管 runner 无法访问局域网飞牛，因此本工作流只做质量门禁，不做内网部署。"
            echo "> 若改用 \`staging\` 分支，需同步修改飞牛 \`deploy-feiniu-poller.sh\` 的 \`BRANCH\`。"
          } >> "$GITHUB_STEP_SUMMARY"
