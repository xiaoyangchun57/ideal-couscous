name: Deploy Acceptance on Feiniu

# 触发：只要往 acceptance 分支 push，飞牛上的 runner 就会自动拉代码并起一份验收容器。
on:
  push:
    branches: [acceptance]

# 最小权限：只读代码即可。
permissions:
  contents: read

# 安全提醒（公共仓库必看）：
# 本仓库是 PUBLIC，fork 的 PR 理论上能在你的飞牛上跑代码。
# 请在 仓库 Settings → Actions → General 里取消勾选
# "Allow fork pull request workflows to run on this fork/runner"（或限制为仅自有分支），
# 且本工作流只监听 push 到 acceptance 分支，不监听 pull_request，已规避大部分风险。

jobs:
  deploy-feiniu:
    # 只跑在飞牛上那个贴了 feiniu-accept 标签的 runner
    runs-on: [self-hosted, feiniu-accept]
    timeout-minutes: 40
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4

      - name: Build and start acceptance container on Feiniu
        working-directory: "平台开发"
        run: |
          set -euo pipefail
          # 先停掉旧验收容器（保留数据卷），再重建，保证每次都是最新代码
          docker compose -f docker-compose.acceptance.yml -p water-accept down --remove-orphans || true
          docker compose -f docker-compose.acceptance.yml -p water-accept up -d --build
          echo "Waiting for acceptance health check (http://127.0.0.1:8080/api/health) ..."
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "ACCEPTANCE_UP:http://<飞牛局域网IP>:8080"
              exit 0
            fi
            sleep 5
          done
          echo "Health check 未在超时内通过，输出最近日志："
          docker compose -f docker-compose.acceptance.yml -p water-accept logs --tail=60
          exit 1
