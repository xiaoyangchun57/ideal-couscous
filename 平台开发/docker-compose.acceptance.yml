# 飞牛局域网验收环境专用 compose
# 与 production 的区别：
#   1) 独立容器名 water-monitor-accept，不碰炎火云生产容器
#   2) 独立数据目录（请在飞牛上先创建 /vol1/docker/water-acceptance），与生产库完全隔离
#   3) 监听 0.0.0.0:8080 对局域网开放（后端 BACKEND_HOST=0.0.0.0），外网访问不到
#   只起 Web 管理台，不启用 SL651 站点接收（验收用不到）。
services:
  water-monitor-accept:
    build:
      context: .
      dockerfile: Dockerfile
    image: water-monitor-app:acceptance
    container_name: water-monitor-accept
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - "umask 0007; exec python app.py"
    environment:
      TZ: Asia/Shanghai
      LD_PRELOAD: /opt/libsqlite-group-mode.so
      # 验收镜像生产行为：与炎火云一致，便于上线前对照
      APP_RUNTIME_PROFILE: "production"
      MINIPROGRAM_STATE: ${MINIPROGRAM_STATE:-formal}
      WX_APPSECRET: ${WX_APPSECRET:-}
      # 1 = 注入演示数据，方便点开就能看到界面；若启动失败改成 "0"
      ENABLE_DEMO_SEED: "1"
      SKIP_BACKFILL: "1"
      # 关键：绑定到 0.0.0.0，否则局域网其它设备访问不到
      BACKEND_HOST: "0.0.0.0"
    ports:
      - "0.0.0.0:8080:5000"
    volumes:
      # 下面两个路径在飞牛上必须先存在；如你的存储卷不是 /vol1 请改前缀
      - /vol1/docker/water-acceptance/data:/app/backend/data
      - /vol1/docker/water-acceptance/uploads:/app/frontend/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
