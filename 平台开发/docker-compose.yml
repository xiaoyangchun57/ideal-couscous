services:
  water-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: water-monitor-app:latest
    container_name: water-monitor
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WX_APPSECRET: ${WX_APPSECRET:-}
      ENABLE_DEMO_SEED: "0"
      SKIP_BACKFILL: "1"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend/uploads:/app/frontend/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
